<text x="24.0" y="394.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">Reserved for the AD9226 ADC module (Phase 4): 12 data bits, OTR and the clock. Not in the Phase 1 bitstream, so none of these pins is driven.</text>
