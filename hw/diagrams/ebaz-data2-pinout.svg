<rect x="512.0" y="345.0" width="378.0" height="22.0" rx="4" fill="#c5f6fa" stroke="#0b7285" stroke-width="1.2"/>
<text x="520.0" y="361.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="bold" fill="#212529">L17  i2c_scl   &gt;   ADS1115 SCL</text>
<text x="24.0" y="394.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">The Phase 1 design routes EMIO SPI0 (CLK 5, DAT 7, LE 8), the lock input (9), CE (13), the PE4302 inputs V1..V6 (14 to 19) and I2C0 (SDA 11, SCL 20) to these pins.</text>
<text x="24.0" y="412.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">SPI and I2C are hardware controllers of the Zynq PS wired to the pins in the bitstream: unlike a pin-muxed SBC they can not be turned into GPIO.</text>
<text x="24.0" y="430.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">EMIO GPIO line n is Linux GPIO 54 + n: V1..V6 = 54..59, CE = 60, LD = 61. All lines are inputs (tri-stated) until software drives them.</text>
<text x="24.0" y="448.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">The PE4302 inputs are tri-stated at boot, so the adapter's 2.2k pull-ups give the default 31.5 dB. Pin 6 (J18) is a spare PL IO.</text>
<text x="24.0" y="466.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">Pins 1 and 2 are the board's supply input (5 to 12 V): do not connect them to the boards. Pins 3, 4 and 12 are ground, pin 10 is not connected.</text>
</svg>
