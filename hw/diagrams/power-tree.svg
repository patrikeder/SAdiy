<text x="24.0" y="580.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">The ADF4351 eval board regulates its 5 V jack to 3.3 V itself. The PE4302 module has no regulator and wants 3.3 V: take it from the SBC pin, which is also the GPIO level.</text>
<text x="24.0" y="600.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">The rail voltage on the shared lever connector in the photos is not known yet: confirm it before connecting the PE4302 pads (3.3 V) and the AD831 (9 to 11 V).</text>
<text x="24.0" y="620.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#6c757d">Grounds meet at one star point near the SBC. GNDA_ADC (P9.34) is only for the optional BBB AIN0 cross-check.</text>
