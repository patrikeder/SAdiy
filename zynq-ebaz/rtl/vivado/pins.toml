# Master pin list for the SAdiy adapter on the EBAZ4205 DATA connectors.
# Owner: session L. The PCB (zynq-ebaz/hw, user only) must match this file;
# change it here first and announce the change in docs/STATUS-linux.md.
# `gen_xdc.py` turns it into constraints/ebaz4205.xdc.
#
# Schematic check (S2, 2026-11-14), against docs EBAZ4205-SCH.pdf (text layer)
# and the community XDC (EBAZ4205_tutorial/ebaz4205_merged.xdc):
#  - All DATA2 balls below agree between the two sources.
#  - DATA nets carry 22 ohm series resistors on the EBAZ board (60 x "22R 1%"
#    in the schematic; R2479, R2483 seen on DATA1). Fine for 10 MHz SPI.
#  - Shared with other functions: DATA1-6 (H16), DATA1-11 (H17), DATA1-15 (H18),
#    DATA1-18 (E19), DATA1-20 (K17) are used as UART_0 / RGB LED pins in the
#    community projects. That is only a use in their designs, not extra
#    hardware on the board (verify with a continuity check before Phase 4).
#  - MISMATCH to resolve before Phase 4: the schematic text puts DATA1-13 on
#    D19, the community table on D20 (and DATA1-16 on D19). Appendix D of the
#    plan follows the community table. D19/D20 are a swap at most.
#  - DATA2 pins carry no board function (no LED, key or PHY on them).
# The schematic PDF has a damaged optional-content list; its text extraction is
# positional and noisy, so this check is "no contradiction found", not a proof.

[defaults]
iostandard = "LVCMOS33"

# Adapter board (HelloFPGA EBAZ4205_ZJB05, 2026-11-15, user decision): its LEDs sit on the DATA1 balls H18, K17 and E19,
# so they are listed here as led[0..2] (active = false: the port is not in the Phase 1 top level; the engine build
# constrains them in rtl/fpga/constraints/adapter_ui.xdc) and the AD9226 pins adc_d[8], adc_d[10] and adc_clk have no
# ball on this adapter. The LEDs can be freed only with a different adapter PCB. Other AD9226 balls shared with the
# adapter (UART header, HDMI, buzzer) carry a note. The DATA3 numbers of keys and display come from the schematic text
# layer and agree with BALLS in src/sadiy/pinmap_ebaz.py; not checked by continuity.

# phase: first project phase that needs the signal. active = true puts the
# constraint into the XDC, false emits it commented out (the port does not
# exist in the current top level).
# dir: in, out, inout (documentation and gen_xdc sanity only).

# ---- DATA2: control (Phase 1, EMIO) ----
# 2026-11-25: the PE4302 attenuator hangs on a PCF8574 on I2C (DATA2-20 / DATA2-11). Its former six lines on DATA2-14..19
# are spare GPIO. The port names pe4302_v[0..5] stay, because the top level and the XDC use them. Do not drive these pins
# while old attenuator wires are still connected.
[[signal]]
name = "adf4351_clk"
connector = "DATA2"
pin = 5
ball = "G20"
dir = "out"
phase = 1
active = true
note = "PS SPI0 SCLK via EMIO"

[[signal]]
name = "adf4351_dat"
connector = "DATA2"
pin = 7
ball = "G19"
dir = "out"
phase = 1
active = true
note = "PS SPI0 MOSI via EMIO"

[[signal]]
name = "adf4351_le"
connector = "DATA2"
pin = 8
ball = "H20"
dir = "out"
phase = 1
active = true
note = "PS SPI0 SS0 via EMIO (LE = chip select)"

[[signal]]
name = "adf4351_ld"
connector = "DATA2"
pin = 9
ball = "J19"
dir = "in"
phase = 1
active = true
pulltype = "PULLDOWN"
note = "lock detect, EMIO GPIO input; pulldown so a missing cable reads unlocked"

[[signal]]
name = "adf4351_ce"
connector = "DATA2"
pin = 13
ball = "K19"
dir = "out"
phase = 1
active = true
note = "EMIO GPIO, tri-stated until software drives it; adapter jumper holds CE high"

[[signal]]
name = "pe4302_v[0]"
connector = "DATA2"
pin = 14
ball = "J20"
dir = "inout"
phase = 1
active = true
note = "spare EMIO GPIO 0 (was PE4302 V1 until 2026-11-25)"

[[signal]]
name = "pe4302_v[1]"
connector = "DATA2"
pin = 15
ball = "L16"
dir = "inout"
phase = 1
active = true
note = "spare EMIO GPIO 1 (was PE4302 V2 until 2026-11-25)"

[[signal]]
name = "pe4302_v[2]"
connector = "DATA2"
pin = 16
ball = "L19"
dir = "inout"
phase = 1
active = true
note = "spare EMIO GPIO 2 (was PE4302 V3 until 2026-11-25)"

[[signal]]
name = "pe4302_v[3]"
connector = "DATA2"
pin = 17
ball = "M18"
dir = "inout"
phase = 1
active = true
note = "spare EMIO GPIO 3 (was PE4302 V4 until 2026-11-25)"

[[signal]]
name = "pe4302_v[4]"
connector = "DATA2"
pin = 18
ball = "L20"
dir = "inout"
phase = 1
active = true
note = "spare EMIO GPIO 4 (was PE4302 V5 until 2026-11-25)"

[[signal]]
name = "pe4302_v[5]"
connector = "DATA2"
pin = 19
ball = "M20"
dir = "inout"
phase = 1
active = true
note = "spare EMIO GPIO 5 (was PE4302 V6 until 2026-11-25)"

[[signal]]
name = "i2c_scl"
connector = "DATA2"
pin = 20
ball = "L17"
dir = "inout"
phase = 1
active = true
pulltype = "PULLUP"
note = "I2C SCL, PS I2C0 via EMIO or the PL engine (PCF8574 of the PE4302, address 0x27)"

[[signal]]
name = "i2c_sda"
connector = "DATA2"
pin = 11
ball = "K18"
dir = "inout"
phase = 1
active = true
pulltype = "PULLUP"
note = "I2C SDA, PS I2C0 via EMIO or the PL engine"

[[signal]]
name = "spare_d2_6"
connector = "DATA2"
pin = 6
ball = "J18"
dir = "inout"
phase = 4
active = false
note = "spare"

