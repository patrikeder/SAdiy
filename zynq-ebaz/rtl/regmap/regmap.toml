# SAdiy PL sweep engine: register map. SINGLE SOURCE for axil_regs.sv, regs.py, regs.h, regmap.md
# (all generated by gen_regs.py; never edit the generated files).
# Owner: session R. Behaviour of every register is specified in zynq-ebaz/docs/rtl-spec.md.
#
# Schema
#   [map]            name, data_width (32), addr_width (bits of the AXI-lite address), version
#   [[reg]]          name (UPPER_CASE), offset (hex, multiple of 4), doc
#     ext = true     the register is implemented outside axil_regs.sv (see rtl-spec.md, "ext registers");
#                    it has no fields that create storage; `fields` are then documentation plus
#                    masks for regs.py / regs.h only.
#     wr_strobe = true  (not with ext) adds an output `foo_wr`, high for one clock on every write of the
#                    register, in the same clock in which the new rw values appear.
#   [[reg.field]]    name (lower_case), bits ("7:0" or "4"), access, reset (int, default 0), doc
#     access         rw    storage in axil_regs, value on an output port
#                    ro    value from an input port
#                    const read-only constant = reset
#                    w1p   writing 1 gives a one-clock pulse on an output port; reads 0
# Bits without a field read 0 and ignore writes. Writes are always full 32-bit words (WSTRB is ignored).

[map]
name = "sadiy"
data_width = 32
addr_width = 12
version = 0x00010003        # major << 16 | minor; bump on every incompatible change

[[reg]]
name = "ID"
offset = 0x000
doc = "Magic number, identifies the core."
  [[reg.field]]
  name = "magic"
  bits = "31:0"
  access = "const"
  reset = 0x53410001
  doc = "'SA' 0001"

[[reg]]
name = "VERSION"
offset = 0x004
doc = "Register map version (major << 16 | minor). Equals [map] version."
  [[reg.field]]
  name = "version"
  bits = "31:0"
  access = "const"
  reset = 0x00010003
  doc = "must equal map.version (gen_regs.py checks)"

[[reg]]
name = "CTRL"
offset = 0x008
doc = "Control. Pulse bits read 0."
  [[reg.field]]
  name = "start"
  bits = "0"
  access = "w1p"
  doc = "Start a sweep over table entries 0..N_ENTRIES-1. Ignored while busy. Clears done, err_lock, aborted, err_table."
  [[reg.field]]
  name = "abort"
  bits = "1"
  access = "w1p"
  doc = "Stop the running sweep after the current SPI word; sets aborted. No effect when idle."
  [[reg.field]]
  name = "soft_reset"
  bits = "2"
  access = "w1p"
  doc = "Reset the sequencer and status bits. Configuration registers and the tables keep their content."
  [[reg.field]]
  name = "irq_en"
  bits = "3"
  access = "rw"
  doc = "irq output = irq_en AND STATUS.done."
  [[reg.field]]
  name = "pin_owner"
  bits = "4"
  access = "rw"
  doc = "Requested owner of the ADF4351 SPI pins and the PE4302 pins: 0 = PS (EMIO), 1 = engine. Takes effect only while idle (see STATUS.pin_owner_act)."
  [[reg.field]]
  name = "stop_on_err"
  bits = "5"
  access = "rw"
  doc = "1 = end the sweep at the first lock timeout (done and err_lock set). 0 = flag the point and continue."
  [[reg.field]]
  name = "irq_ack"
  bits = "6"
  access = "w1p"
  doc = "Clear STATUS.done (and so the irq)."

[[reg]]
name = "STATUS"
offset = 0x00C
doc = "Status, read-only."
  [[reg.field]]
  name = "busy"
  bits = "0"
  access = "ro"
  doc = "A sweep is running."
  [[reg.field]]
  name = "done"
  bits = "1"
  access = "ro"
  doc = "Sticky: the last sweep ended (normally, by stop_on_err, or by abort). Cleared by start, irq_ack, soft_reset."
  [[reg.field]]
  name = "err_lock"
  bits = "2"
  access = "ro"
  doc = "Sticky: at least one measured point timed out waiting for lock detect. Cleared by start, soft_reset."
  [[reg.field]]
  name = "aborted"
  bits = "3"
  access = "ro"
  doc = "Sticky: the last sweep was ended by abort. Cleared by start, soft_reset."
  [[reg.field]]
  name = "ld_now"
  bits = "4"
  access = "ro"
  doc = "Synchronised live level of the ADF4351 lock detect pin."
  [[reg.field]]
  name = "wait_sample"
  bits = "5"
  access = "ro"
  doc = "The sequencer is in SAMPLE and waits for detector samples (with DET_CFG.src = 0 the PS must write DET_PUSH now)."
  [[reg.field]]
  name = "err_table"
  bits = "6"
  access = "ro"
  doc = "Sticky: start was refused (N_ENTRIES = 0 or above the table depth, or pin_owner_act = 0) or the result memory overflowed. Cleared by start, soft_reset."
  [[reg.field]]
  name = "pin_owner_act"
  bits = "7"
  access = "ro"
  doc = "Owner in effect: follows CTRL.pin_owner while not busy."
  [[reg.field]]
  name = "state"
  bits = "11:8"
  access = "ro"
  doc = "Sequencer state, for debugging (encoding in rtl-spec.md)."

[[reg]]
name = "N_ENTRIES"
offset = 0x010
doc = "Number of table entries one sweep executes (1 .. 2^TABLE_AW)."
  [[reg.field]]
  name = "n"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "N_AVG"
offset = 0x014
doc = "Detector samples summed per measured point (1 .. 4095). 0 is treated as 1."
  [[reg.field]]
  name = "n"
  bits = "11:0"
  access = "rw"
  reset = 1
  doc = ""

[[reg]]
name = "SPI_DIV"
offset = 0x018
doc = "ADF4351 SPI half bit period in clk cycles (f_sclk = f_clk / (2 * div)). Values below 2 are treated as 2. Reset 5 = 10 MHz at 100 MHz."
  [[reg.field]]
  name = "div"
  bits = "7:0"
  access = "rw"
  reset = 5
  doc = ""

[[reg]]
name = "T_ATT_GAP_CYC"
offset = 0x01C
doc = "PE4302 make-before-break: clk cycles the intermediate (make) state is held, and again after the final state before the entry continues."
  [[reg.field]]
  name = "cycles"
  bits = "15:0"
  access = "rw"
  reset = 100
  doc = "100 = 1 us at 100 MHz"

[[reg]]
name = "T_MIN_US"
offset = 0x020
doc = "Microseconds after the last SPI word of a measured entry during which lock detect is ignored (VCO band selection)."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 200
  doc = ""

[[reg]]
name = "T_LOCK_STABLE_US"
offset = 0x024
doc = "Lock detect must stay high for this long without a break to count as locked."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 50
  doc = ""

[[reg]]
name = "T_LOCK_TIMEOUT_US"
offset = 0x028
doc = "Give up waiting for lock after this long (counted from the end of T_MIN_US)."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 10000
  doc = ""

[[reg]]
name = "T_SETTLE_US"
offset = 0x02C
doc = "Detector settling time between lock (or timeout) and the first sample."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 500
  doc = ""

[[reg]]
name = "PE4302"
offset = 0x030
wr_strobe = true
doc = "PE4302 pin control of the engine. Reset state = all stages in (31.5 dB) for an active-high module."
  [[reg.field]]
  name = "manual"
  bits = "5:0"
  access = "rw"
  reset = 0x3F
  doc = "Pin levels V1..V6 (bit 0 = V1). A write while the engine owns the pins and is idle moves the pins there, make-before-break, if they differ. A write at any other time only stores the value. Taking the pins loads this value directly."
  [[reg.field]]
  name = "active_high"
  bits = "8"
  access = "rw"
  reset = 1
  doc = "1 = a high pin switches the stage in (make state = old OR new). 0 = low switches in (make state = old AND new)."

[[reg]]
name = "PIN_STATE"
offset = 0x034
doc = "Live pins after the pin mux, synchronised to clk."
  [[reg.field]]
  name = "pe_in"
  bits = "5:0"
  access = "ro"
  doc = "Levels read back from the PE4302 pins."
  [[reg.field]]
  name = "ld"
  bits = "8"
  access = "ro"
  doc = "adf4351_ld"
  [[reg.field]]
  name = "le"
  bits = "9"
  access = "ro"
  doc = "adf4351_le as driven"
  [[reg.field]]
  name = "clk"
  bits = "10"
  access = "ro"
  doc = "adf4351_clk as driven"
  [[reg.field]]
  name = "dat"
  bits = "11"
  access = "ro"
  doc = "adf4351_dat as driven"
  [[reg.field]]
  name = "ce"
  bits = "12"
  access = "ro"
  doc = "adf4351_ce pad level"
  [[reg.field]]
  name = "scl"
  bits = "13"
  access = "ro"
  doc = "i2c_scl pad level"
  [[reg.field]]
  name = "sda"
  bits = "14"
  access = "ro"
  doc = "i2c_sda pad level"
  [[reg.field]]
  name = "i2c_pl"
  bits = "15"
  access = "ro"
  doc = "1 = the ADS1115 reader of the PL owns the I2C pins (engine owns the pins and DET_CFG.src = 3); 0 = PS I2C0."
  [[reg.field]]
  name = "pe_out"
  bits = "21:16"
  access = "ro"
  doc = "Levels driven on the PE4302 pins (meaningful where pe_t = 0)."
  [[reg.field]]
  name = "pe_t"
  bits = "29:24"
  access = "ro"
  doc = "1 = that PE4302 pin is not driven (PS owner with the GPIO line as input)."

[[reg]]
name = "DET_CFG"
offset = 0x038
doc = "Detector sample source."
  [[reg.field]]
  name = "src"
  bits = "1:0"
  access = "rw"
  doc = "Video path (mode = 0): 0 = PS push (DET_PUSH), 1 = test generator (DET_TEST), 2 = sample stream selected by `stream` (negative samples count as 0), 3 = ADS1115 reader in the PL (ADC_* registers; the engine then owns the I2C pins while it owns the other pins)."
  [[reg.field]]
  name = "mode"
  bits = "4"
  access = "rw"
  doc = "0 = video path: a result is the sum of N_AVG detector samples. 1 = IF path: the sample stream goes through NCO, mixer, CIC and power detector (IF_* registers); a result is {exp[5:0], mant[21:0]} of the power sum, bit 30 = over-range."
  [[reg.field]]
  name = "stream"
  bits = "8"
  access = "rw"
  doc = "Sample stream for src = 2 and for the IF path: 0 = det_ext_* port of sadiy_top (an ADC adapter), 1 = sample generator (GEN_* registers)."

[[reg]]
name = "DET_TEST"
offset = 0x03C
doc = "Test generator: sample = (base + low 8 bits of the result index) mod 65536, one sample per microsecond tick while the sequencer is in SAMPLE."
  [[reg.field]]
  name = "base"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "DET_PUSH"
offset = 0x040
ext = true
doc = "Write: one detector sample (bits 15:0) for DET_CFG.src = 0. Counted only while STATUS.wait_sample = 1; otherwise dropped. Reads 0."
  [[reg.field]]
  name = "sample"
  bits = "15:0"
  access = "rw"
  doc = "unsigned ADC code"

[[reg]]
name = "FIRST_ERR_INDEX"
offset = 0x044
doc = "Result index of the first point with a lock timeout in the last sweep (valid when STATUS.err_lock = 1)."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "ro"
  doc = ""

[[reg]]
name = "POINT_COUNT"
offset = 0x048
doc = "Results stored so far in the current / last sweep (= number of measured entries completed)."
  [[reg.field]]
  name = "count"
  bits = "15:0"
  access = "ro"
  doc = ""

[[reg]]
name = "SWEEP_COUNT"
offset = 0x04C
doc = "Sweeps completed since reset (normal end only), wraps."
  [[reg.field]]
  name = "count"
  bits = "31:0"
  access = "ro"
  doc = ""

[[reg]]
name = "ENTRY_INDEX"
offset = 0x050
doc = "Table entry the sequencer is executing (or the one after the last, when done)."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "ro"
  doc = ""

[[reg]]
name = "TABLE_ADDR"
offset = 0x060
ext = true
doc = "Table entry index for the next TABLE_W1 write. Read / write; increments by one on every TABLE_W1 write. Writes are ignored while busy."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "TABLE_W0"
offset = 0x064
doc = "Word 0 of the table entry being written: the 32-bit SPI word (sent MSB first)."
  [[reg.field]]
  name = "word"
  bits = "31:0"
  access = "rw"
  doc = ""

[[reg]]
name = "TABLE_W1"
offset = 0x068
ext = true
doc = "Word 1 of the table entry (flags). Writing it stores {W1, TABLE_W0} at TABLE_ADDR and increments TABLE_ADDR. Ignored while busy. Reads 0."
  [[reg.field]]
  name = "att"
  bits = "5:0"
  access = "rw"
  doc = "PE4302 pin levels V1..V6 (bit 0 = V1), used when att_en = 1"
  [[reg.field]]
  name = "spi_en"
  bits = "8"
  access = "rw"
  doc = "send word 0 to the ADF4351"
  [[reg.field]]
  name = "att_en"
  bits = "9"
  access = "rw"
  doc = "apply att, make-before-break, before the SPI word"
  [[reg.field]]
  name = "measure"
  bits = "10"
  access = "rw"
  doc = "after the SPI word: wait, lock, settle, sample, store one result"
  [[reg.field]]
  name = "skip_lock"
  bits = "11"
  access = "rw"
  doc = "with measure: do not wait for lock detect (debug, or no LD wired)"

[[reg]]
name = "RESULT_ADDR"
offset = 0x070
ext = true
doc = "Result index for the next RESULT_DATA read. Read / write; increments by one on every RESULT_DATA read."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "RESULT_DATA"
offset = 0x074
ext = true
doc = "Result word at RESULT_ADDR (read-only, read increments RESULT_ADDR). Wait at least 2 clk cycles after writing RESULT_ADDR (always true from the PS)."
  [[reg.field]]
  name = "sum"
  bits = "27:0"
  access = "ro"
  doc = "sum of N_AVG samples"
  [[reg.field]]
  name = "unlocked"
  bits = "31"
  access = "ro"
  doc = "lock detect timed out for this point"

[[reg]]
name = "CAPS"
offset = 0x078
doc = "Build parameters."
  [[reg.field]]
  name = "table_aw"
  bits = "7:0"
  access = "ro"
  doc = "table depth = 2^table_aw entries"
  [[reg.field]]
  name = "result_aw"
  bits = "15:8"
  access = "ro"
  doc = "result depth = 2^result_aw points"
  [[reg.field]]
  name = "clk_mhz"
  bits = "31:16"
  access = "ro"
  doc = "fabric clock in MHz (the microsecond tick divides by this)"

[[reg]]
name = "ADC_CFG"
offset = 0x080
doc = "ADS1115 reader (DET_CFG.src = 3): what is written to the ADC for every sample."
  [[reg.field]]
  name = "config"
  bits = "15:0"
  access = "rw"
  reset = 0xC3E3
  doc = "ADS1115 config register word, written before every sample; must have OS = 1 and MODE = 1 (single shot). Reset: AIN0 to GND, +/-4.096 V, 860 SPS, comparator off."
  [[reg.field]]
  name = "addr"
  bits = "22:16"
  access = "rw"
  reset = 0x48
  doc = "I2C address of the ADS1115 (0x48 = ADDR pin to GND)."

[[reg]]
name = "ADC_I2C_DIV"
offset = 0x084
doc = "ADS1115 reader: I2C quarter bit period in clk cycles (f_scl = f_clk / (4 * div)). Values below 4 are treated as 4. Reset 70 = 357 kHz at 100 MHz (t_low 1.4 us)."
  [[reg.field]]
  name = "div"
  bits = "11:0"
  access = "rw"
  reset = 70
  doc = ""

[[reg]]
name = "ADC_T_CONV_US"
offset = 0x088
doc = "ADS1115 reader: microseconds between the config write (conversion start) and the read. Must exceed the conversion time of the data rate in ADC_CFG.config plus its 10 % tolerance. Reset 1400 for 860 SPS."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 1400
  doc = ""

[[reg]]
name = "ADC_STAT"
offset = 0x08C
doc = "ADS1115 reader status, read-only."
  [[reg.field]]
  name = "last"
  bits = "15:0"
  access = "ro"
  doc = "Conversion register of the last sample as read from the ADC (two's complement)."
  [[reg.field]]
  name = "err_nack"
  bits = "16"
  access = "ro"
  doc = "Sticky: the ADC did not acknowledge (missing, wrong address, bus held). That sample was delivered as 0. Cleared by start and soft_reset."
  [[reg.field]]
  name = "busy"
  bits = "17"
  access = "ro"
  doc = "A sample (bus transaction or conversion wait) is in progress."
  [[reg.field]]
  name = "count"
  bits = "31:24"
  access = "ro"
  doc = "Conversions read since reset, wraps."

[[reg]]
name = "ADF_PINS"
offset = 0x090
doc = "ADF4351 pins outside the SPI, driven while the engine owns the pins."
  [[reg.field]]
  name = "ce"
  bits = "0"
  access = "rw"
  reset = 1
  doc = "Level of adf4351_ce while the engine owns the pins (1 = chip enabled). With the PS as owner the pin follows EMIO GPIO 6."

[[reg]]
name = "GEN_CFG"
offset = 0x0A0
doc = "Sample generator: plays the pattern written through GEN_ADDR / GEN_DATA as a sample stream, in place of an ADC."
  [[reg.field]]
  name = "div"
  bits = "15:0"
  access = "rw"
  reset = 1000
  doc = "clk cycles per sample (0 and 1 = one sample every clock). Reset 1000 = 100 kSPS at 100 MHz."
  [[reg.field]]
  name = "len_m1"
  bits = "27:16"
  access = "rw"
  doc = "Last sample index of the pattern (length - 1); the playback wraps to 0 after it."
  [[reg.field]]
  name = "sync"
  bits = "30"
  access = "rw"
  reset = 1
  doc = "1 = the playback restarts at sample 0 when a measurement (SAMPLE) starts, so results are repeatable. 0 = free running like an ADC."
  [[reg.field]]
  name = "enable"
  bits = "31"
  access = "rw"
  doc = "1 = play."

[[reg]]
name = "GEN_ADDR"
offset = 0x0A4
ext = true
doc = "Pattern index for the next GEN_DATA write. Read / write; increments by one on every GEN_DATA write."
  [[reg.field]]
  name = "index"
  bits = "11:0"
  access = "rw"
  doc = ""

[[reg]]
name = "GEN_DATA"
offset = 0x0A8
ext = true
doc = "Write: one pattern sample (stream format: 16 bit two's complement) to GEN_ADDR, then GEN_ADDR + 1. Reads 0. Write only while the generator is disabled or idle."
  [[reg.field]]
  name = "sample"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "IF_NCO"
offset = 0x0B0
doc = "IF path: NCO phase increment of the first point of a sweep (f = inc * fs / 2^32, two's complement for negative frequencies)."
  [[reg.field]]
  name = "inc"
  bits = "31:0"
  access = "rw"
  doc = ""

[[reg]]
name = "IF_NCO_STEP"
offset = 0x0B4
doc = "IF path: added to the NCO increment at every further measured point of the sweep (digital sweep inside the IF window). 0 = the same IF for all points."
  [[reg.field]]
  name = "step"
  bits = "31:0"
  access = "rw"
  doc = ""

[[reg]]
name = "IF_CIC"
offset = 0x0B8
doc = "IF path: decimating filter. The resolution bandwidth is about fs / r."
  [[reg.field]]
  name = "r"
  bits = "15:0"
  access = "rw"
  reset = 16
  doc = "Decimation factor of the 3-stage CIC (1 .. 65535; 0 is treated as 1). Gain r^3."
  [[reg.field]]
  name = "shift"
  bits = "21:16"
  access = "rw"
  reset = 11
  doc = "Arithmetic right shift after the filter, before the saturation to 18 bit; about 3 * log2(r) - 1."
  [[reg.field]]
  name = "skip"
  bits = "27:24"
  access = "rw"
  reset = 4
  doc = "Filter outputs dropped at the start of every measurement (settling; at least 3)."

[[reg]]
name = "FE_CFG"
offset = 0x0C0
doc = "ADC front end (AD9226 module): clock output, capture, and what the data lines carry. Samples reach the IF path / detector as the sample stream when enable = 1 and DET_CFG.stream = 0 (rtl-spec.md section 8d, adc-module.md)."
  [[reg.field]]
  name = "enable"
  bits = "0"
  access = "rw"
  doc = "1 = the adc_clk output runs and the captured samples are the external stream; 0 = the clock pin is low and the stream input of the engine (det_ext_*) is used."
  [[reg.field]]
  name = "src"
  bits = "2:1"
  access = "rw"
  doc = "What the capture sees on the data lines: 0 = tie-off (FE_TIE.code, FE_TIE.otr), 1 = traffic generator (FE_CFG.tg_mode), 2 = the adc_d / adc_otr pins (3 reads as 2). Tie-off and generator need no pins and no module."
  [[reg.field]]
  name = "twos"
  bits = "3"
  access = "rw"
  doc = "1 = the ADC is strapped for two's complement output (the AD9226 module is offset binary: 0)."
  [[reg.field]]
  name = "tg_mode"
  bits = "5:4"
  access = "rw"
  doc = "Traffic generator (src = 1), one code per ADC clock: 0 = ramp 0..4095 (OTR high on code 4095), 1 = walking one (1 << (n mod 12): finds swapped data lines), 2 = tone (FE_TG_INC, full scale), 3 = constant FE_TIE.code."
  [[reg.field]]
  name = "clear"
  bits = "6"
  access = "w1p"
  doc = "Clear FE_STAT.count and FE_STAT.otr_seen."
  [[reg.field]]
  name = "div"
  bits = "15:8"
  access = "rw"
  reset = 2
  doc = "Clock cycles per ADC clock period (sample rate = fabric clock / div; values below 2 act as 2). Reset 2 = 50 MS/s at 100 MHz (adc-module.md: the first build rate)."
  [[reg.field]]
  name = "phase"
  bits = "23:16"
  access = "rw"
  reset = 1
  doc = "Clock cycle of the ADC clock period (0 = the cycle in which adc_clk rises) in which the data lines are taken; choose it away from the output transition of the ADC (adc_ad9226.sv). Below div. Reset 1 = the value the module tests of adc_ad9226 recommend for div 2; the right one depends on the board delay (bench)."

[[reg]]
name = "FE_TIE"
offset = 0x0C4
doc = "ADC front end tie-off and constant code."
  [[reg.field]]
  name = "code"
  bits = "11:0"
  access = "rw"
  reset = 0x800
  doc = "12-bit code of the tie-off source (FE_CFG.src = 0) and of the constant generator mode. Reset 0x800 = mid scale (sample 0 for the offset binary AD9226)."
  [[reg.field]]
  name = "otr"
  bits = "16"
  access = "rw"
  doc = "OTR level of the tie-off source."

[[reg]]
name = "FE_TG_INC"
offset = 0x0C8
doc = "ADC front end traffic generator, tone mode: phase increment per ADC clock (f = inc * fs / 2^32)."
  [[reg.field]]
  name = "inc"
  bits = "31:0"
  access = "rw"
  reset = 919123001
  doc = "Reset 919123001 = 10.7 MHz at 50 MS/s."

[[reg]]
name = "FE_STAT"
offset = 0x0CC
doc = "ADC front end status."
  [[reg.field]]
  name = "last_code"
  bits = "11:0"
  access = "ro"
  doc = "Raw 12-bit code of the last captured sample."
  [[reg.field]]
  name = "last_otr"
  bits = "12"
  access = "ro"
  doc = "OTR of the last captured sample."
  [[reg.field]]
  name = "otr_seen"
  bits = "13"
  access = "ro"
  doc = "Sticky: OTR was set in a captured sample since the last FE_CFG.clear."
  [[reg.field]]
  name = "count"
  bits = "31:16"
  access = "ro"
  doc = "Captured samples since the last FE_CFG.clear (wraps at 65536). Counts while FE_CFG.enable = 1; stops when the clock is off."
