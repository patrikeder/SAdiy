# SAdiy PL sweep engine: register map. SINGLE SOURCE for axil_regs.sv, regs.py, regs.h, regmap.md
# (all generated by gen_regs.py; never edit the generated files).
# Owner: session R. Behaviour of every register is specified in zynq-ebaz/docs/rtl-spec.md.
#
# Schema
#   [map]            name, data_width (32), addr_width (bits of the AXI-lite address), version
#   [[reg]]          name (UPPER_CASE), offset (hex, multiple of 4), doc
#     ext = true     the register is implemented outside axil_regs.sv (see rtl-spec.md, "ext registers");
#                    it has no fields that create storage; `fields` are then documentation plus
#                    masks for regs.py / regs.h only.
#     wr_strobe = true  (not with ext) adds an output `foo_wr`, high for one clock on every write of the
#                    register, in the same clock in which the new rw values appear.
#   [[reg.field]]    name (lower_case), bits ("7:0" or "4"), access, reset (int, default 0), doc
#     access         rw    storage in axil_regs, value on an output port
#                    ro    value from an input port
#                    const read-only constant = reset
#                    w1p   writing 1 gives a one-clock pulse on an output port; reads 0
# Bits without a field read 0 and ignore writes. Writes are always full 32-bit words (WSTRB is ignored).

[map]
name = "sadiy"
data_width = 32
addr_width = 12
version = 0x00010000        # major << 16 | minor; bump on every incompatible change

[[reg]]
name = "ID"
offset = 0x000
doc = "Magic number, identifies the core."
  [[reg.field]]
  name = "magic"
  bits = "31:0"
  access = "const"
  reset = 0x53410001
  doc = "'SA' 0001"

[[reg]]
name = "VERSION"
offset = 0x004
doc = "Register map version (major << 16 | minor). Equals [map] version."
  [[reg.field]]
  name = "version"
  bits = "31:0"
  access = "const"
  reset = 0x00010000
  doc = "must equal map.version (gen_regs.py checks)"

[[reg]]
name = "CTRL"
offset = 0x008
doc = "Control. Pulse bits read 0."
  [[reg.field]]
  name = "start"
  bits = "0"
  access = "w1p"
  doc = "Start a sweep over table entries 0..N_ENTRIES-1. Ignored while busy. Clears done, err_lock, aborted, err_table."
  [[reg.field]]
  name = "abort"
  bits = "1"
  access = "w1p"
  doc = "Stop the running sweep after the current SPI word; sets aborted. No effect when idle."
  [[reg.field]]
  name = "soft_reset"
  bits = "2"
  access = "w1p"
  doc = "Reset the sequencer and status bits. Configuration registers and the tables keep their content."
  [[reg.field]]
  name = "irq_en"
  bits = "3"
  access = "rw"
  doc = "irq output = irq_en AND STATUS.done."
  [[reg.field]]
  name = "pin_owner"
  bits = "4"
  access = "rw"
  doc = "Requested owner of the ADF4351 SPI pins and the PE4302 pins: 0 = PS (EMIO), 1 = engine. Takes effect only while idle (see STATUS.pin_owner_act)."
  [[reg.field]]
  name = "stop_on_err"
  bits = "5"
  access = "rw"
  doc = "1 = end the sweep at the first lock timeout (done and err_lock set). 0 = flag the point and continue."
  [[reg.field]]
  name = "irq_ack"
  bits = "6"
  access = "w1p"
  doc = "Clear STATUS.done (and so the irq)."

[[reg]]
name = "STATUS"
offset = 0x00C
doc = "Status, read-only."
  [[reg.field]]
  name = "busy"
  bits = "0"
  access = "ro"
  doc = "A sweep is running."
  [[reg.field]]
  name = "done"
  bits = "1"
  access = "ro"
  doc = "Sticky: the last sweep ended (normally, by stop_on_err, or by abort). Cleared by start, irq_ack, soft_reset."
  [[reg.field]]
  name = "err_lock"
  bits = "2"
  access = "ro"
  doc = "Sticky: at least one measured point timed out waiting for lock detect. Cleared by start, soft_reset."
  [[reg.field]]
  name = "aborted"
  bits = "3"
  access = "ro"
  doc = "Sticky: the last sweep was ended by abort. Cleared by start, soft_reset."
  [[reg.field]]
  name = "ld_now"
  bits = "4"
  access = "ro"
  doc = "Synchronised live level of the ADF4351 lock detect pin."
  [[reg.field]]
  name = "wait_sample"
  bits = "5"
  access = "ro"
  doc = "The sequencer is in SAMPLE and waits for detector samples (with DET_CFG.src = 0 the PS must write DET_PUSH now)."
  [[reg.field]]
  name = "err_table"
  bits = "6"
  access = "ro"
  doc = "Sticky: start was refused (N_ENTRIES = 0 or above the table depth, or pin_owner_act = 0) or the result memory overflowed. Cleared by start, soft_reset."
  [[reg.field]]
  name = "pin_owner_act"
  bits = "7"
  access = "ro"
  doc = "Owner in effect: follows CTRL.pin_owner while not busy."
  [[reg.field]]
  name = "state"
  bits = "11:8"
  access = "ro"
  doc = "Sequencer state, for debugging (encoding in rtl-spec.md)."

[[reg]]
name = "N_ENTRIES"
offset = 0x010
doc = "Number of table entries one sweep executes (1 .. 2^TABLE_AW)."
  [[reg.field]]
  name = "n"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "N_AVG"
offset = 0x014
doc = "Detector samples summed per measured point (1 .. 4095). 0 is treated as 1."
  [[reg.field]]
  name = "n"
  bits = "11:0"
  access = "rw"
  reset = 1
  doc = ""

[[reg]]
name = "SPI_DIV"
offset = 0x018
doc = "ADF4351 SPI half bit period in clk cycles (f_sclk = f_clk / (2 * div)). Values below 2 are treated as 2. Reset 5 = 10 MHz at 100 MHz."
  [[reg.field]]
  name = "div"
  bits = "7:0"
  access = "rw"
  reset = 5
  doc = ""

[[reg]]
name = "T_ATT_GAP_CYC"
offset = 0x01C
doc = "PE4302 make-before-break: clk cycles the intermediate (make) state is held, and again after the final state before the entry continues."
  [[reg.field]]
  name = "cycles"
  bits = "15:0"
  access = "rw"
  reset = 100
  doc = "100 = 1 us at 100 MHz"

[[reg]]
name = "T_MIN_US"
offset = 0x020
doc = "Microseconds after the last SPI word of a measured entry during which lock detect is ignored (VCO band selection)."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 200
  doc = ""

[[reg]]
name = "T_LOCK_STABLE_US"
offset = 0x024
doc = "Lock detect must stay high for this long without a break to count as locked."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 50
  doc = ""

[[reg]]
name = "T_LOCK_TIMEOUT_US"
offset = 0x028
doc = "Give up waiting for lock after this long (counted from the end of T_MIN_US)."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 10000
  doc = ""

[[reg]]
name = "T_SETTLE_US"
offset = 0x02C
doc = "Detector settling time between lock (or timeout) and the first sample."
  [[reg.field]]
  name = "us"
  bits = "19:0"
  access = "rw"
  reset = 500
  doc = ""

[[reg]]
name = "PE4302"
offset = 0x030
wr_strobe = true
doc = "PE4302 pin control of the engine. Reset state = all stages in (31.5 dB) for an active-high module."
  [[reg.field]]
  name = "manual"
  bits = "5:0"
  access = "rw"
  reset = 0x3F
  doc = "Pin levels V1..V6 (bit 0 = V1). A write while the engine owns the pins and is idle moves the pins there, make-before-break, if they differ. A write at any other time only stores the value. Taking the pins loads this value directly."
  [[reg.field]]
  name = "active_high"
  bits = "8"
  access = "rw"
  reset = 1
  doc = "1 = a high pin switches the stage in (make state = old OR new). 0 = low switches in (make state = old AND new)."

[[reg]]
name = "PIN_STATE"
offset = 0x034
doc = "Live pins after the pin mux, synchronised to clk."
  [[reg.field]]
  name = "pe_in"
  bits = "5:0"
  access = "ro"
  doc = "Levels read back from the PE4302 pins."
  [[reg.field]]
  name = "ld"
  bits = "8"
  access = "ro"
  doc = "adf4351_ld"
  [[reg.field]]
  name = "le"
  bits = "9"
  access = "ro"
  doc = "adf4351_le as driven"
  [[reg.field]]
  name = "clk"
  bits = "10"
  access = "ro"
  doc = "adf4351_clk as driven"
  [[reg.field]]
  name = "dat"
  bits = "11"
  access = "ro"
  doc = "adf4351_dat as driven"
  [[reg.field]]
  name = "pe_out"
  bits = "21:16"
  access = "ro"
  doc = "Levels driven on the PE4302 pins (meaningful where pe_t = 0)."
  [[reg.field]]
  name = "pe_t"
  bits = "29:24"
  access = "ro"
  doc = "1 = that PE4302 pin is not driven (PS owner with the GPIO line as input)."

[[reg]]
name = "DET_CFG"
offset = 0x038
doc = "Detector sample source."
  [[reg.field]]
  name = "src"
  bits = "1:0"
  access = "rw"
  doc = "0 = PS push (DET_PUSH), 1 = test generator (DET_TEST), 2 = external stream (det_ext_*, the PL ADC reader of S10), 3 = reserved (no samples)."

[[reg]]
name = "DET_TEST"
offset = 0x03C
doc = "Test generator: sample = (base + low 8 bits of the result index) mod 65536, one sample per microsecond tick while the sequencer is in SAMPLE."
  [[reg.field]]
  name = "base"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "DET_PUSH"
offset = 0x040
ext = true
doc = "Write: one detector sample (bits 15:0) for DET_CFG.src = 0. Counted only while STATUS.wait_sample = 1; otherwise dropped. Reads 0."
  [[reg.field]]
  name = "sample"
  bits = "15:0"
  access = "rw"
  doc = "unsigned ADC code"

[[reg]]
name = "FIRST_ERR_INDEX"
offset = 0x044
doc = "Result index of the first point with a lock timeout in the last sweep (valid when STATUS.err_lock = 1)."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "ro"
  doc = ""

[[reg]]
name = "POINT_COUNT"
offset = 0x048
doc = "Results stored so far in the current / last sweep (= number of measured entries completed)."
  [[reg.field]]
  name = "count"
  bits = "15:0"
  access = "ro"
  doc = ""

[[reg]]
name = "SWEEP_COUNT"
offset = 0x04C
doc = "Sweeps completed since reset (normal end only), wraps."
  [[reg.field]]
  name = "count"
  bits = "31:0"
  access = "ro"
  doc = ""

[[reg]]
name = "ENTRY_INDEX"
offset = 0x050
doc = "Table entry the sequencer is executing (or the one after the last, when done)."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "ro"
  doc = ""

[[reg]]
name = "TABLE_ADDR"
offset = 0x060
ext = true
doc = "Table entry index for the next TABLE_W1 write. Read / write; increments by one on every TABLE_W1 write. Writes are ignored while busy."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "TABLE_W0"
offset = 0x064
doc = "Word 0 of the table entry being written: the 32-bit SPI word (sent MSB first)."
  [[reg.field]]
  name = "word"
  bits = "31:0"
  access = "rw"
  doc = ""

[[reg]]
name = "TABLE_W1"
offset = 0x068
ext = true
doc = "Word 1 of the table entry (flags). Writing it stores {W1, TABLE_W0} at TABLE_ADDR and increments TABLE_ADDR. Ignored while busy. Reads 0."
  [[reg.field]]
  name = "att"
  bits = "5:0"
  access = "rw"
  doc = "PE4302 pin levels V1..V6 (bit 0 = V1), used when att_en = 1"
  [[reg.field]]
  name = "spi_en"
  bits = "8"
  access = "rw"
  doc = "send word 0 to the ADF4351"
  [[reg.field]]
  name = "att_en"
  bits = "9"
  access = "rw"
  doc = "apply att, make-before-break, before the SPI word"
  [[reg.field]]
  name = "measure"
  bits = "10"
  access = "rw"
  doc = "after the SPI word: wait, lock, settle, sample, store one result"
  [[reg.field]]
  name = "skip_lock"
  bits = "11"
  access = "rw"
  doc = "with measure: do not wait for lock detect (debug, or no LD wired)"

[[reg]]
name = "RESULT_ADDR"
offset = 0x070
ext = true
doc = "Result index for the next RESULT_DATA read. Read / write; increments by one on every RESULT_DATA read."
  [[reg.field]]
  name = "index"
  bits = "15:0"
  access = "rw"
  doc = ""

[[reg]]
name = "RESULT_DATA"
offset = 0x074
ext = true
doc = "Result word at RESULT_ADDR (read-only, read increments RESULT_ADDR). Wait at least 2 clk cycles after writing RESULT_ADDR (always true from the PS)."
  [[reg.field]]
  name = "sum"
  bits = "27:0"
  access = "ro"
  doc = "sum of N_AVG samples"
  [[reg.field]]
  name = "unlocked"
  bits = "31"
  access = "ro"
  doc = "lock detect timed out for this point"

[[reg]]
name = "CAPS"
offset = 0x078
doc = "Build parameters."
  [[reg.field]]
  name = "table_aw"
  bits = "7:0"
  access = "ro"
  doc = "table depth = 2^table_aw entries"
  [[reg.field]]
  name = "result_aw"
  bits = "15:8"
  access = "ro"
  doc = "result depth = 2^result_aw points"
  [[reg.field]]
  name = "clk_mhz"
  bits = "31:16"
  access = "ro"
  doc = "fabric clock in MHz (the microsecond tick divides by this)"
