<text x="670" y="256" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[7]</text>
<text x="482" y="268" fill="#999" font-size="9">HDMI +5 V and shield pins: never wire to a signal. Negatives are inferred from the package pairing.</text>
