<text x="670" y="220" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[0]</text>
<text x="482" y="250" fill="#fff" font-size="12" font-weight="bold">CLK</text>
<text x="540" y="242" fill="#fff" font-size="12" font-weight="bold">F19+</text>
<text x="540" y="256" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[9]</text>
