<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" font-family="Helvetica,Arial,sans-serif">
<title>HelloFPGA adapter pinout</title>
<rect width="1500" height="900" fill="#fff"/>
<text x="20" y="30" font-size="20" font-weight="bold">Pinout with the HelloFPGA adapter (EBAZ4205_ZJB05)</text>
<text x="20" y="50" fill="#555" font-size="12">Schematic of the adapter as in the photo (top view). Text: signal, then FPGA ball and bank. Italic purple = proposal for the AD9226, not constrained.</text>
<rect x="20" y="70" width="940" height="810" rx="16" fill="#1c1c1c" stroke="#000" stroke-width="3"/>
<rect x="26" y="230" width="22" height="210" rx="3" fill="#444" stroke="#888"/>
<text x="56" y="246" fill="#fff" font-size="13" font-weight="bold">DATA1</text>
<text x="56" y="262" fill="#bbb" font-size="10">HDMI, 3 LEDs, buzzer, UART header</text>
<rect x="26" y="470" width="22" height="180" rx="3" fill="#444" stroke="#888"/>
<text x="56" y="486" fill="#fff" font-size="13" font-weight="bold">DATA2</text>
<text x="56" y="502" fill="#bbb" font-size="10">right connector: control signals</text>
<rect x="26" y="680" width="22" height="180" rx="3" fill="#444" stroke="#888"/>
<text x="56" y="696" fill="#fff" font-size="13" font-weight="bold">DATA3</text>
<text x="56" y="712" fill="#bbb" font-size="10">keys, LCD, 4 pins to the right connector</text>
<text x="56" y="214" fill="#bbb" font-size="10">EBAZ4205 plugs into these three headers</text>
<rect x="70" y="90" width="150" height="100" rx="6" fill="#2a2a2a" stroke="#888"/>
<text x="80" y="108" fill="#fff" font-size="12" font-weight="bold">UART header</text>
<text x="80" y="122" fill="#bbb" font-size="10">jumpers to the USB-UART (EMIO)</text>
<text x="80" y="146" text-anchor="start" font-size="12" font-weight="bold" fill="#fff">H16 = RX</text>
<text x="80" y="158" text-anchor="start" font-size="9" fill="#9ad">H16 · bank 35</text>
<text x="80" y="176" text-anchor="start" font-size="12" font-weight="bold" fill="#fff">H17 = TX</text>
<text x="80" y="188" text-anchor="start" font-size="9" fill="#9ad">H17 · bank 35</text>
<rect x="300" y="86" width="110" height="34" rx="6" fill="#888"/><text x="355" y="108" text-anchor="middle" font-size="12" font-weight="bold">USB-C 5 V</text>
<text x="300" y="140" fill="#bbb" font-size="10">5V / 3V3 / GND pads next to it</text>
<rect x="470" y="86" width="340" height="188" rx="8" fill="#2a2a2a" stroke="#8a4fbf" stroke-width="2"/>
<text x="482" y="106" fill="#c9a6ee" font-size="13" font-weight="bold">HDMI port (HDMI_PIN): 4 TMDS pairs, use with the HDMI breakout</text>
<text x="482" y="142" fill="#fff" font-size="12" font-weight="bold">DAT0</text>
<text x="540" y="134" fill="#fff" font-size="12" font-weight="bold">D19+</text>
<text x="540" y="148" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[6]</text>
<text x="670" y="134" fill="#fff" font-size="12" font-weight="bold">D20- (inferred)</text>
<text x="670" y="148" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[4]</text>
<text x="482" y="178" fill="#fff" font-size="12" font-weight="bold">DAT1</text>
<text x="540" y="170" fill="#fff" font-size="12" font-weight="bold">C20+</text>
<text x="540" y="184" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[3]</text>
<text x="670" y="170" fill="#fff" font-size="12" font-weight="bold">B20- (inferred)</text>
<text x="670" y="184" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[2]</text>
<text x="482" y="214" fill="#fff" font-size="12" font-weight="bold">DAT2</text>
<text x="540" y="206" fill="#fff" font-size="12" font-weight="bold">B19+</text>
<text x="540" y="220" fill="#c9a6ee" font-size="11" font-style="italic">adc_d[1]</text>
