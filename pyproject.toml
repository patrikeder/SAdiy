[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sadiy"
version = "0.1.0"
description = "DIY swept spectrum analyzer: BeagleBone Black / Raspberry Pi control and acquisition"
requires-python = ">=3.9"
dependencies = ["numpy", "pyzmq", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
hw = ["spidev"]
ui = ["pyqtgraph", "PyQt5; platform_machine != 'aarch64'"]
dev = ["pytest", "ruff"]

[project.scripts]
sweepd = "sadiy.server.sweepd:main"
sadiy-gui = "sadiy.ui.sa_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "zynq-ebaz/sw/tests", "zynq-ebaz/rtl/tests"]
pythonpath = ["src", "zynq-ebaz/sw"]
